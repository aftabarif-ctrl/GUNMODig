name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: List repo files
        run: find . -path ./.git -prune -o -type f -name "*.java" -print

      - name: Build
        run: gradle build --no-daemon --console=plain

      - name: Show jars
        run: |
          ls -l build/libs
          for j in build/libs/*.jar; do echo "== $j"; unzip -l "$j" | head -40; done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: modernarms-1.21.1
          path: build/libs/modernarms-1.0.0.jar
