name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The project has no gradlew, so this installs Gradle 8.12 directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: modernarms-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
